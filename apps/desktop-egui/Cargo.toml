[package]
name = "atlas-desktop-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WhereIsIt AI — native PR58-first desktop UI"

[dependencies]
atlas-service = { path = "../../crates/atlas-service" }
eframe = { version = "=0.37.0", default-features = true, features = ["persistence"] }
egui_extras = { version = "=0.37.0", default-features = false }
serde_json.workspace = true
png = { version = "=0.18.1", optional = true }

[features]
qa-screenshots = ["dep:png"]
qa-isolated = []

[dev-dependencies]
tempfile.workspace = true
