[package]
name = "atlas-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
atlas-service = { path = "../../crates/atlas-service" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
