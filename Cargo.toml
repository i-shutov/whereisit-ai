[workspace]
resolver = "2"
members = ["crates/atlas-core", "crates/ctf-format", "crates/atlas-service", "crates/atlas-ffi", "crates/atlas-cli", "apps/windows"]
default-members = ["crates/atlas-core", "crates/ctf-format", "crates/atlas-cli", "crates/atlas-ffi"]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "=0.39.0", features = ["bundled", "functions", "modern_sqlite"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

