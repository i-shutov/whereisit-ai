name: B1 read-only real CTF diagnostic tools
on:
  push:
    branches: [research/b1-real-ctf-20261029]
    paths:
      - "crates/atlas-service/examples/ctf_real_probe.rs"
      - "tools/block1/**"
      - ".github/workflows/b1-real-ctf.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b1-real-ctf-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format and verify workspace + standalone probes
        run: |
          cargo fmt --all
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m py_compile tools/block1/run_private_ctf.py tools/block1/benchmark_columnar.py
          python3 -m unittest discover -s tools/block1 -p 'test_*.py' -v
          cargo run --release --locked -p atlas-service --example ctf_real_probe -- --self-test
          cargo run --release --locked -p atlas-service --example ctf_real_ram_index -- --self-test
          cargo run --release --locked -p atlas-service --example ctf_real_acceptance -- --self-test
      - name: Commit only verified formatting if branch head unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/b1-real-ctf-20261029
          if [ "$(git rev-parse origin/research/b1-real-ctf-20261029)" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced, refusing to overwrite newer source' >&2
            exit 1
          fi
          git add crates/atlas-service/examples/ctf_real_probe.rs crates/atlas-service/examples/ctf_real_ram_index.rs
          if ! git diff --cached --quiet; then
            git config user.name 'whereisit-ci'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(b1): format verified CTF probe [skip ci]'
            git push origin HEAD:refs/heads/research/b1-real-ctf-20261029
          fi
  native-binaries:
    needs: verify-and-format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/b1-real-ctf-20261029
      - run: rustup toolchain install 1.90.0 --profile minimal
        shell: bash
      - name: Build privacy-safe native tools
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p atlas-service --example ctf_real_probe --example ctf_real_acceptance --example ctf_real_ram_index
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/examples/ctf_real_probe$ext" "dist/ctf_real_probe$ext"
          cp "target/release/examples/ctf_real_acceptance$ext" "dist/ctf_real_acceptance$ext"
          cp "target/release/examples/ctf_real_ram_index$ext" "dist/ctf_real_ram_index$ext"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          printf 'source_sha=%s\nrunner=%s\n' "$(git rev-parse HEAD)" "$RUNNER_OS-$RUNNER_ARCH" > dist/PROVENANCE.txt
      - name: Run both synthetic self-tests
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          "./dist/ctf_real_probe$ext" --self-test
          "./dist/ctf_real_acceptance$ext" --self-test
          "./dist/ctf_real_ram_index$ext" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: b1-CTF-tools-${{ matrix.os }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 60

  columnar-synthetic-smoke:
    needs: verify-and-format
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/b1-real-ctf-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build CLI and generated CTF fixture
        run: |
          cargo build --release --locked -p atlas-cli
          cargo build --release --locked -p atlas-service --example perf_ctf_ram
          python -m pip install duckdb==1.5.5 polars==1.43.2
      - name: Assert SQLite DuckDB Polars parity on generated input
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ctf-work"
          target/release/examples/perf_ctf_ram generate "$RUNNER_TEMP/ctf-work" 1000
          python tools/block1/benchmark_columnar.py \
            --cli "target/release/atlas" \
            --output "$RUNNER_TEMP/b1-columnar-report" \
            "$RUNNER_TEMP/ctf-work/source.ctf"
          test -f "$RUNNER_TEMP/b1-columnar-report/columnar-1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-columnar-synthetic-report
          path: ${{ runner.temp }}/b1-columnar-report/columnar-1.json
          if-no-files-found: warn
