# The real source CTFs are never placed on GitHub runners.
name: B1 read-only real CTF diagnostic tools
on:
  push:
    branches: [research/b1-real-ctf-20261029, "fix/b1-ctf-*"]
    paths:
      - "crates/atlas-service/examples/ctf_real_probe.rs"
      - "crates/atlas-service/examples/ctf_real_acceptance.rs"
      - "crates/atlas-service/examples/ctf_real_ram_index.rs"
      - "crates/atlas-service/examples/ctf_b1_fixture.rs"
      - "tools/block1/**"
      - ".github/workflows/b1-real-ctf.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b1-real-ctf-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify exact source SHA, formatting and standalone probes
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m py_compile tools/block1/run_private_ctf.py tools/block1/benchmark_columnar.py
          python3 -m unittest discover -s tools/block1 -p 'test_*.py' -v
          cargo run --release --locked -p atlas-service --example ctf_real_probe -- --self-test
          cargo run --release --locked -p atlas-service --example ctf_real_ram_index -- --self-test
          cargo run --release --locked -p atlas-service --example ctf_real_acceptance -- --self-test
      - name: Validate complete checkpoint through three real Rust binaries (two generated CTFs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b1-generated"
          cargo build --release --locked -p atlas-service --example ctf_b1_fixture
          target/release/examples/ctf_b1_fixture "$RUNNER_TEMP/b1-generated/generated-1.CTF" 1000
          target/release/examples/ctf_b1_fixture "$RUNNER_TEMP/b1-generated/generated-2.CTF" 1200
          python3 tools/block1/run_private_ctf.py \
            --probe target/release/examples/ctf_real_probe \
            --acceptance target/release/examples/ctf_real_acceptance \
            --ram-index target/release/examples/ctf_real_ram_index \
            --output "$RUNNER_TEMP/b1-native-checkpoint" \
            "$RUNNER_TEMP/b1-generated/generated-1.CTF" \
            "$RUNNER_TEMP/b1-generated/generated-2.CTF"
          python3 - "$RUNNER_TEMP/b1-native-checkpoint/B1_CHECKPOINT.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["passed_available_checks"]
          assert result["inputs_are_real_user_ctf"] is False
          assert result["input_origin_method"] == "unverified"
          assert len(result["files"]) == 2
          assert all(f["unchanged"] for f in result["files"])
          assert [p["status"] for p in result["phases"]] == ["passed"] * 3
          print("PASS two generated CTFs through native CTF/SQLite/RAM checkpoint")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-generated-native-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/b1-native-checkpoint/
          if-no-files-found: warn
          retention-days: 30
  native-binaries:
    needs: verify-and-format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal
        shell: bash
      - name: Build privacy-safe native tools
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p atlas-service --example ctf_real_probe --example ctf_real_acceptance --example ctf_real_ram_index
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/examples/ctf_real_probe$ext" "dist/ctf_real_probe$ext"
          cp "target/release/examples/ctf_real_acceptance$ext" "dist/ctf_real_acceptance$ext"
          cp "target/release/examples/ctf_real_ram_index$ext" "dist/ctf_real_ram_index$ext"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          printf 'source_sha=%s\nrunner=%s\n' "$(git rev-parse HEAD)" "$RUNNER_OS-$RUNNER_ARCH" > dist/PROVENANCE.txt
      - name: Run both synthetic self-tests
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          "./dist/ctf_real_probe$ext" --self-test
          "./dist/ctf_real_acceptance$ext" --self-test
          "./dist/ctf_real_ram_index$ext" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: b1-CTF-tools-${{ matrix.os }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 60

  columnar-synthetic-smoke:
    needs: verify-and-format
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build CLI and generated CTF fixture
        run: |
          cargo build --release --locked -p atlas-cli
          cargo build --release --locked -p atlas-service --example ctf_b1_fixture
          python -m pip install duckdb==1.5.5 polars==1.43.2
      - name: Assert SQLite DuckDB Polars parity on generated input
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ctf-work"
          target/release/examples/ctf_b1_fixture "$RUNNER_TEMP/ctf-work/source.ctf" 1000
          python tools/block1/benchmark_columnar.py \
            --cli "target/release/atlas" \
            --output "$RUNNER_TEMP/b1-columnar-report" \
            "$RUNNER_TEMP/ctf-work/source.ctf"
          test -f "$RUNNER_TEMP/b1-columnar-report/columnar-1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-columnar-synthetic-report
          path: ${{ runner.temp }}/b1-columnar-report/columnar-1.json
          if-no-files-found: warn
