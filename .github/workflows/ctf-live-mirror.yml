# Generated CTF only; private catalogs and derived SQLite never enter Actions.
name: External CTF SHA-bound mirror — cross-platform native acceptance
on:
  push:
    branches: [feat/ctf-live-mirror-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctf-live-mirror-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mirror-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify source-change, corrupted mirror, rollback and readonly tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build exact-source CLI with patched embedded SQLite
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p atlas-cli
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          test "$(target/release/atlas$ext --sqlite-version)" = "3.51.3"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          cp "target/release/atlas$ext" dist/
          printf 'source_sha=%s\nrunner=%s-%s\nsqlite=3.51.3\nprivate_CTF_uploaded=false\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > dist/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ctf-live-mirror-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          retention-days: 21
          if-no-files-found: error
