name: Prepare compact v3 source
on:
  push:
    branches: ['release/1.0-hardening']
    paths:
      - 'tools/dev/apply_compact_v3.py'
      - 'tools/dev/finish_compact_v3.py'
      - 'tools/dev/prepare_release_identity.py'
      - 'tools/dev/add_maintenance_ui.py'
      - '.github/workflows/prepare-compact-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-compact-v3
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'i-shutov/whereisit-ai' && github.ref == 'refs/heads/release/1.0-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.90-test
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Apply checked source and release metadata transformations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/dev/apply_compact_v3.py
          python3 tools/dev/finish_compact_v3.py
          python3 tools/dev/prepare_release_identity.py
          python3 tools/dev/add_maintenance_ui.py
          sed -i 's/result == PathBuf::from(protected)/result == protected/' crates/atlas-service/src/maintenance.rs
          gh api repos/i-shutov/whereisit-ai/git/blobs/ab1210ecbb5da8d8154b60da76b0a72034ad295e --jq .content | base64 --decode > tools/storage_audit.py
          test "$(git hash-object tools/storage_audit.py)" = ab1210ecbb5da8d8154b60da76b0a72034ad295e
      - run: cargo fmt --all
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 tools/storage_audit.py --self-test
      - run: bash -n apps/macos/build.sh installers/macos/package.sh installers/macos/smoke-package.sh
      - name: Small synthetic benchmark correctness check
        run: cargo run --locked -p atlas-service --example compact_benchmark -- 1000 > compact-smoke.json
      - name: Commit tested source to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'whereisit-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates apps installers Cargo.toml Cargo.lock THIRD_PARTY_NOTICES.md tools/storage_audit.py
          if ! git diff --cached --quiet; then
            git commit -m 'release: verified 1.0 RC identity, compact catalog UI and native CLI'
            git push origin HEAD:refs/heads/release/1.0-hardening
          fi
          gh workflow run build.yml --ref release/1.0-hardening
      - name: Preserve source diff if verification fails
        if: failure()
        run: git diff > compact-v3-failed.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compact-v3-source-diff
          path: compact-v3-failed.patch
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compact-smoke-metrics
          path: compact-smoke.json
          if-no-files-found: error
