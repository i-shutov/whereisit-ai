name: WhereIsIt AI — native CI and installer candidates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash -n apps/macos/build.sh installers/macos/package.sh
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p atlas-windows -p atlas-cli
      - name: Prepare Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create per-user Windows installer candidate
        shell: pwsh
        run: ./installers/windows/build-installer.ps1
      - name: Smoke-test Windows setup, installed CLI and safe uninstall
        shell: pwsh
        run: ./installers/windows/smoke-installer.ps1
      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'dist/windows/WhereIsItAI-*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows setup executable.' }
          Get-FileHash $files[0].FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-Windows-x64-unsigned-candidate
          path: |
            target/release/atlas-windows.exe
            target/release/atlas.exe
            dist/windows/*.exe
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo test --workspace --locked
      - run: bash apps/macos/build.sh
      - run: bash installers/macos/package.sh
      - run: bash installers/macos/smoke-package.sh
      - run: |
          test -d 'dist/macos/WhereIsIt AI.app'
          test -f 'dist/macos/installers/WhereIsItAI-0.1.0-macOS-'"$(uname -m)"'.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-${{ matrix.os }}-unsigned-candidate
          path: dist/macos/installers/*
