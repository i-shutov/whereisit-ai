name: WhereIsIt AI — native CI and installer candidates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  win11-shell-template-hosted-probe:
    # A fast independent probe of custom shell syntax on GitHub-hosted Windows,
    # NOT the privileged user Win11 self-hosted runner.
    name: Win11 shell template hosted probe
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Execute an extensionless temp script with process-scoped PowerShell
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create([IO.File]::ReadAllText('{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Environment]::Is64BitOperatingSystem -ne $true) { throw 'Expected x64' }
          Write-Host 'WIN11_SHELL_TEMPLATE_HOSTED_PASS'
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.100-test
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: python3 tools/dev/verify_release_identity.py
      - run: python3 -m unittest discover -s tools/qa -p 'test_usb_disk_locator_contract.py' -v
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Synthetic native export wiring regression
        run: python3 -m unittest discover -s tools/qa -p 'test_native_export_wiring.py' -v
      - name: Synthetic upgrade catalog preservation regression
        run: python3 -m unittest discover -s tools/qa -p 'test_upgrade_catalog_probe.py' -v
      - run: python3 -m unittest discover -s tools/qa -p 'test_redact_private_ctf_acceptance.py' -v
      # Independently compare all 15 fields on generated-only CSV/Parquet fixtures.
      - name: Synthetic independent CSV/Parquet field-parity contract
        run: |
          python3 -m venv .ctf-qa-venv
          .ctf-qa-venv/bin/python -m pip install --disable-pip-version-check duckdb==1.4.1
          .ctf-qa-venv/bin/python -m unittest discover -s tools/qa -p 'test_offline_ctf_v3.py' -v
      - run: |
          if test -f tools/storage_audit.py; then python3 tools/storage_audit.py --self-test; fi
          if test -f tools/storage_layout_experiment.py; then python3 tools/storage_layout_experiment.py --self-test; fi
      - run: bash -n apps/macos/build.sh apps/desktop-egui/package-preview-macos.sh installers/macos/package.sh installers/macos/smoke-package.sh installers/macos/verify-dmg.sh installers/macos/test-verify-dmg.sh
      - run: python3 -m unittest discover -s tools/qa -p 'test_egui_preview_packaging.py' -v
      - run: python3 -m unittest discover -s tools/qa -p 'test_egui_win64_installer_contract.py' -v
      - run: python3 -m unittest discover -s tools/qa -p 'test_win10_egui_host_qa.py' -v
      - run: python3 -m unittest discover -s tools/qa -p 'test_win11_codex_handoff_contract.py' -v
      - run: bash installers/macos/test-verify-dmg.sh
  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.100-release
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p atlas-windows -p atlas-cli
      - name: Compile native Rust/egui desktop preview
        run: cargo build --release --locked -p atlas-desktop-egui
      - name: Build isolated egui Windows QA preview ZIP
        shell: pwsh
        run: ./apps/desktop-egui/package-preview-windows.ps1
      - name: Parse Win11 Codex read-only launcher (do not run agent)
        shell: powershell
        run: |
          $tokens = @()
          $parseErrors = @()
          $path = (Resolve-Path 'tools/qa/windows11-egui/Invoke-Win11CodexReadOnlyAudit.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Win11 Codex audit launcher failed PowerShell syntax validation.' }
      - name: Windows PowerShell 5.1 native CLI transport regression
        shell: powershell
        run: ./tools/qa/windows10-egui/Test-CliTransport.ps1 -Cli ./target/release/atlas.exe
      - name: Offline synthetic egui integration smoke (headless Windows runner)
        shell: powershell
        run: |
          ./dist/qa-egui/windows-x64/Invoke-WhereIsItEguiQA.ps1 -EvidenceRoot "$env:RUNNER_TEMP/WhereIsItAI-Egui-QA" -DiskCount 6 -SkipGui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhereIsItAI-egui-qa-windows-synthetic-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/WhereIsItAI-Egui-QA/Run-*/qa_report.json
            ${{ runner.temp }}/WhereIsItAI-Egui-QA/Run-*/qa_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-egui-qa-windows-x64
          if-no-files-found: error
          path: |
            dist/qa-egui/*.zip
            dist/qa-egui/SHA256-windows-x64.txt
            dist/qa-egui/provenance-windows-x64.json
      - name: Prepare Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build per-user Windows installer candidate
        shell: pwsh
        run: ./installers/windows/build-installer.ps1
      - name: Verify install, installed CLI and safe uninstall
        shell: pwsh
        run: ./installers/windows/smoke-installer.ps1
      - name: Build isolated Win64 egui QA app (dedicated settings and sidecar)
        shell: powershell
        run: |
          cargo test --locked -p atlas-desktop-egui --features qa-isolated
          if ($LASTEXITCODE -ne 0) { throw 'QA-isolated egui tests failed' }
          cargo build --release --locked -p atlas-desktop-egui --features qa-isolated
          if ($LASTEXITCODE -ne 0) { throw 'QA-isolated egui build failed' }
      - name: Build native egui Win64 installed QA candidate (hosted AMD64 only)
        shell: powershell
        run: ./installers/windows/build-egui-win64-qa.ps1
      - name: Verify installed AMD64 egui GUI, CLI and safe uninstall
        shell: powershell
        run: ./installers/windows/smoke-egui-win64-qa.ps1
      - name: Win64 installed egui QA SHA-256 and provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist/windows-egui-win64-qa'
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = Join-Path $dir "WhereIsItAI-egui-win64-QA-$version-setup.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing Win64 egui QA setup' }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $(Split-Path $exe -Leaf)" | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          @{
            channel = 'unsigned-isolated-qa'
            platform = 'windows-x64'
            binary_machine = 'AMD64'
            target_ui = 'Rust/egui'
            version = $version
            commit = (git rev-parse HEAD).Trim()
            run_id = $env:GITHUB_RUN_ID
            installer_sha256 = $sha
            egui_sha256 = (Get-FileHash 'target/release/atlas-desktop-egui.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            cli_sha256 = (Get-FileHash 'target/release/atlas.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            signing = 'unsigned'
            stable_ready = $false
            user_catalogs_included = $false
          } | ConvertTo-Json | Set-Content (Join-Path $dir 'provenance.json') -Encoding utf8
      - name: Verify exact SHA/run Win64 candidate payload before upload
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          ./tools/qa/windows11-egui/Verify-Win64EguiCandidate.ps1 -CandidateDirectory 'dist/windows-egui-win64-qa' -ExpectedCommit $head -ExpectedRunId $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-egui-Win64-installed-QA-unsigned
          if-no-files-found: error
          path: |
            dist/windows-egui-win64-qa/WhereIsItAI-egui-win64-QA-*-setup.exe
            dist/windows-egui-win64-qa/SHA256SUMS.txt
            dist/windows-egui-win64-qa/provenance.json
      - name: Restore default preview GUI binary for the existing generic artifact
        shell: powershell
        run: |
          $preview = 'dist/qa-egui/windows-x64/WhereIsItAI-egui-preview.exe'
          if (-not (Test-Path -LiteralPath $preview -PathType Leaf)) {
            throw 'Missing default egui preview executable for generic artifact'
          }
          Copy-Item -LiteralPath $preview -Destination 'target/release/atlas-desktop-egui.exe' -Force
      - name: Checksums and provenance
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'dist/windows/WhereIsItAI-*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($files[0].Name)" | Set-Content dist/windows/SHA256SUMS.txt -Encoding ascii
          @{commit=(git rev-parse HEAD);run_id=$env:GITHUB_RUN_ID;signing='unsigned';platform='windows-x64'} | ConvertTo-Json | Set-Content dist/windows/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-Windows-x64-unsigned-candidate
          if-no-files-found: error
          path: |
            target/release/atlas-windows.exe
            target/release/atlas-desktop-egui.exe
            target/release/atlas.exe
            dist/windows/*.exe
            dist/windows/SHA256SUMS.txt
            dist/windows/provenance.json
  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.100-release
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo test --workspace --locked
      - name: Compile native Rust/egui desktop preview
        run: cargo build --release --locked -p atlas-desktop-egui
      - name: Build isolated egui macOS QA preview app
        run: bash apps/desktop-egui/package-preview-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-egui-qa-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/qa-egui/*.zip
            dist/qa-egui/SHA256-*.txt
            dist/qa-egui/provenance-*.txt
      - run: bash apps/macos/build.sh
      - run: bash installers/macos/package.sh
      - run: bash installers/macos/smoke-package.sh
      - name: Record exact source
        run: |
          printf 'commit=%s\nrun_id=%s\nsigning=ad-hoc, not notarized\narchitecture=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$(uname -m)" > dist/macos/installers/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsItAI-${{ matrix.os }}-unsigned-candidate
          if-no-files-found: error
          path: |
            dist/macos/installers/*
            target/release/atlas-desktop-egui
