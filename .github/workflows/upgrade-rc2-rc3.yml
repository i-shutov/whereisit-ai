# Actual published RC2 installers upgraded to the exact RC3 candidate.
# Generated fixtures only; never upload databases or CTF files.
name: Native release RC2 to RC3 upgrade acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-rc2-rc3-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.90-release
      - name: Verify checked-out release source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(tr -d '\r\n' < VERSION)" = "1.0.0-rc.3"
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build current Windows installer from exact source
        shell: pwsh
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo build --release --locked -p atlas-windows -p atlas-cli
          if ($LASTEXITCODE -ne 0) { throw 'Rust release build failed' }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup unavailable' }
          ./installers/windows/build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Current installer build failed' }
      - name: Install immutable RC2 then RC3 in-place; verify catalog survival
        shell: pwsh
        run: |
          python -m py_compile tools/qa/upgrade_catalog_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'QA probe failed Python compilation' }
          ./tools/qa/upgrade-rc3-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows upgrade QA failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-Windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/qa-upgrade/windows/UPGRADE-WINDOWS.json
          if-no-files-found: warn
          retention-days: 30
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.90-release
      - name: Verify checked-out release source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(tr -d '\r\n' < VERSION)" = "1.0.0-rc.3"
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build current app and PKG/DMG from exact source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked
          bash apps/macos/build.sh
          bash installers/macos/package.sh
      - name: Actual RC2 to RC3 in-place PKG upgrade and data persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/qa/upgrade_catalog_probe.py
          bash tools/qa/upgrade-rc3-macos.sh
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/qa-upgrade/*/UPGRADE-MACOS.json
          if-no-files-found: warn
          retention-days: 30
