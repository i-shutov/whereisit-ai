# No private CTF, SQL database or user metadata enter GitHub Actions.
name: Bulk FTS5 fresh-v3 experiment CLI
on:
  push:
    branches: [perf/fts-bulk-rebuild-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fts-bulk-${{ github.sha }}
  cancel-in-progress: false
jobs:
  smoke-and-linux-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Validate FTS parity, rollback, formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p atlas-core --test fts_bulk
          cargo test --locked -p atlas-service --lib
          cargo clippy --locked -p atlas-core -p atlas-service --all-targets -- -D warnings
      - name: Build exact-source CLI and provenance
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p atlas-cli
          test "$(target/release/atlas --sqlite-version)" = 3.51.3
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          cp target/release/atlas LICENSE THIRD_PARTY_NOTICES.md dist/
          printf 'commit=%s\nsqlite=%s\nprivate_CTF_data_used=false\n' \
            "$GITHUB_SHA" "$(./dist/atlas --sqlite-version)" > dist/PROVENANCE.txt
          (cd dist && sha256sum atlas LICENSE THIRD_PARTY_NOTICES.md PROVENANCE.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fts-bulk-experiment-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 21
