name: Format isolated CTF sidecar prototype
on:
  push:
    branches: ['feat/ctf-content-bound-sidecars']
    paths: ['.github/workflows/format-ctf-sidecar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'i-shutov/whereisit-ai' && github.ref == 'refs/heads/feat/ctf-content-bound-sidecars'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ctf-binding-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-1.90-v1
      - name: Format and verify without touching any private data
        run: |
          cargo fmt --all
          cargo test -p atlas-service --test ctf_sidecar_contract --locked
          cargo clippy -p atlas-service --test ctf_sidecar_contract --example ctf_real_acceptance --locked -- -D warnings
          cargo run --release --locked -p atlas-service --example ctf_real_acceptance -- --self-test > /tmp/synthetic-acceptance.json
      - name: Commit formatting only with a branch-head guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin feat/ctf-content-bound-sidecars
          test "$(git rev-parse origin/feat/ctf-content-bound-sidecars)" = "$GITHUB_SHA"
          git config user.name 'whereisit-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/atlas-service/ctf_sidecar/mod.rs crates/atlas-service/tests/ctf_sidecar_contract.rs crates/atlas-service/examples/ctf_real_acceptance.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: rustfmt tested CTF source-binding prototype'
            git push origin HEAD:refs/heads/feat/ctf-content-bound-sidecars
            gh workflow run ctf-sidecar-contract.yml --ref feat/ctf-content-bound-sidecars
          fi
