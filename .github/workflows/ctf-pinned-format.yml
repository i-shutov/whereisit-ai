name: Format pinned CTF search on isolated branch
on:
  push:
    branches: [feat/ctf-pinned-search-20261030]
    paths:
      - ".github/workflows/ctf-pinned-format.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctf-pinned-format
  cancel-in-progress: false
jobs:
  format-and-test:
    if: github.repository == 'i-shutov/whereisit-ai' && github.ref == 'refs/heads/feat/ctf-pinned-search-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format only pinning files and test the new contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --name-only > pinned-formatter-files.txt
          python3 - <<'PY'
          from pathlib import Path
          accepted = {
              "crates/atlas-service/src/ctf_mirror.rs",
              "crates/atlas-service/src/lib.rs",
              "crates/atlas-service/tests/ctf_mirror_contract.rs",
          }
          changed = set(Path("pinned-formatter-files.txt").read_text().splitlines())
          assert changed <= accepted, f"Unexpected formatting: {sorted(changed - accepted)}"
          print("Format changes:", sorted(changed))
          PY
          cargo fmt --all -- --check
          cargo test --locked -p atlas-service --test ctf_mirror_contract
          cargo clippy --locked -p atlas-service --all-targets -- -D warnings
      - name: Commit formatting only under exact-head lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/ctf-pinned-search-20261030
          test "$(git rev-parse origin/feat/ctf-pinned-search-20261030)" = "$GITHUB_SHA"
          git add -- crates/atlas-service/src/ctf_mirror.rs crates/atlas-service/src/lib.rs crates/atlas-service/tests/ctf_mirror_contract.rs
          if ! git diff --cached --quiet; then
            git config user.name 'whereisit-ci'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(ctf): rustfmt pinned search native contract'
            git push origin HEAD:refs/heads/feat/ctf-pinned-search-20261030
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-formatter-result
          path: pinned-formatter-files.txt
          if-no-files-found: error
          retention-days: 14
