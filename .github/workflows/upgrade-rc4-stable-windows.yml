# Exact-source Windows installed-product upgrade and rollback. Both source
# trees are immutable commits; all catalog data is generated on the hosted runner.
name: Native egui Windows installed upgrade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: egui-exact-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RC4_SHA: 751fa5454c813e60b61800b517685ccab7e9776a
  V100_SHA: 938fece2d74793c2eda7a1b84082ab5db3f8a092
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  installed-upgrade:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          persist-credentials: false
      - name: Select the exact historical predecessor for this target version
        id: pair
        shell: pwsh
        run: |
          $targetSha = (git -C target rev-parse HEAD).Trim()
          if ($targetSha -ne $env:TARGET_SHA) { throw 'Target checkout SHA mismatch' }
          $targetVersion = (Get-Content target/VERSION -Raw).Trim()
          switch ($targetVersion) {
            '1.0.0' { $sourceSha = $env:RC4_SHA; $sourceVersion = '1.0.0-rc.4' }
            '1.1.0-rc.1' { $sourceSha = $env:V100_SHA; $sourceVersion = '1.0.0' }
            default { throw "Unsupported upgrade target version: $targetVersion" }
          }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "source_version=$sourceVersion" >> $env:GITHUB_OUTPUT
          "target_version=$targetVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pair.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
            target/target
          key: egui-exact-upgrade-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-${{ hashFiles('source/Cargo.lock', 'target/Cargo.lock') }}
          restore-keys: |
            egui-rc3-rc4-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('target/Cargo.lock') }}-1.100-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source trees and release versions
        shell: pwsh
        run: |
          if ((git -C target rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Target checkout SHA mismatch' }
          if ((Get-Content source/VERSION -Raw).Trim() -ne '${{ steps.pair.outputs.source_version }}') { throw 'Unexpected pinned predecessor version' }
          if ((Get-Content target/VERSION -Raw).Trim() -ne '${{ steps.pair.outputs.target_version }}') { throw 'Target version changed after pair selection' }
          $expectedSourceSha = '${{ steps.pair.outputs.source_sha }}'
          if ((git -C source rev-parse HEAD).Trim() -ne $expectedSourceSha) { throw 'Predecessor checkout SHA mismatch' }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - name: Build both exact-source Windows installers
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup unavailable' }
          foreach ($source in @('source', 'target')) {
            Push-Location $source
            try {
              cargo +1.100.0 build --release --locked -p atlas-desktop-egui -p atlas-cli
              if ($LASTEXITCODE -ne 0) { throw "Build failed for $source" }
              ./installers/windows/build-egui-product.ps1 -BuildDir (Resolve-Path 'target/release').Path
              if ($LASTEXITCODE -ne 0) { throw "Product packaging failed for $source" }
            } finally { Pop-Location }
          }
      - name: Install, upgrade, uninstall and roll back
        shell: pwsh
        run: |
          ./target/tools/qa/upgrade-rc4-stable-windows.ps1 -SourceRoot (Resolve-Path source).Path
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source installed upgrade lifecycle failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: egui-exact-upgrade-windows-${{ env.TARGET_SHA }}
          path: target/dist/qa-egui-upgrade/UPGRADE.json
          if-no-files-found: error
          retention-days: 30
