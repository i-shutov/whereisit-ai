name: Publish Windows stable
on:
  create:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit used by the validated native build
        required: false
        type: string
      native_run_id:
        description: Trusted native CI run ID with successful test and Windows jobs for that exact commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-windows-stable
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'release/windows-') &&
       endsWith(github.event.ref, '-publish') &&
       github.ref == format('refs/heads/{0}', github.event.ref))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      PUBLICATION_EVENT_REF: ${{ github.event.ref }}
    steps:
      - name: Validate source and resolve the trusted native run
        id: resolve
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]]
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$SOURCE_SHA" == "$REQUESTED_SOURCE_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == 'create' ]]
            [[ "$PUBLICATION_EVENT_REF" =~ ^release/windows-([0-9]+)\.([0-9]+)-publish$ ]]
            [[ "$GITHUB_REF" == "refs/heads/$PUBLICATION_EVENT_REF" ]]
            [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          fi
          mkdir -p "$RUNNER_TEMP/stable-verification"
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/stable-verification/current-main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/stable-verification/candidate-runs.json"
          python3 - <<'PY'
          import json, os, subprocess, sys
          current = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'stable-verification/current-main.json'), encoding='utf-8-sig'))
          assert current.get('sha') == os.environ['SOURCE_SHA'], 'source_sha must be current main'
          requested = os.environ.get('REQUESTED_RUN_ID', '')
          if requested:
              run_id = requested
          else:
              runs = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'stable-verification/candidate-runs.json'), encoding='utf-8-sig')).get('workflow_runs', [])
              def allowed_run_state(run):
                  status, conclusion = run.get('status'), run.get('conclusion')
                  return ((status == 'in_progress' and conclusion is None)
                          or (status == 'completed' and conclusion in ('success', 'failure', 'cancelled')))
              def required_jobs_pass(run_id):
                  response = subprocess.run(
                      ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/jobs?per_page=100"],
                      check=True, capture_output=True, text=True)
                  jobs = json.loads(response.stdout).get('jobs', [])
                  for name in ('test', 'windows'):
                      matches = [job for job in jobs if job.get('name') == name]
                      if (len(matches) != 1 or matches[0].get('conclusion') != 'success'
                              or matches[0].get('status') != 'completed'):
                          return False
                  return True
              trusted = [run for run in runs if run.get('head_sha') == os.environ['SOURCE_SHA']
                         and run.get('head_branch') == 'main' and run.get('event') == 'push'
                         and run.get('path') == '.github/workflows/build.yml'
                         and allowed_run_state(run)
                         and run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']]
              run_id = ''
              for candidate in sorted(trusted, key=lambda run: (run.get('run_number', 0), run.get('updated_at', '')), reverse=True):
                  candidate_id = str(candidate.get('id', ''))
                  if candidate_id.isdigit() and required_jobs_pass(candidate_id):
                      run_id = candidate_id
                      break
              assert run_id, 'no trusted exact-source main push run has successful test and windows jobs'
          assert run_id.isdigit(), 'native run ID must be numeric'
          print('ci_run_id=' + run_id, file=open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8'))
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify current main and successful source-bound Windows CI
        env:
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > verified-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > verified-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('verified-run.json', encoding='utf-8-sig'))
          assert str(run.get('id')) == os.environ['CI_RUN_ID'], 'resolved run ID mismatch'
          assert run.get('head_sha') == os.environ['SOURCE_SHA'], 'run SHA mismatch'
          assert run.get('head_branch') == 'main', 'run branch must be main'
          status, conclusion = run.get('status'), run.get('conclusion')
          assert ((status == 'in_progress' and conclusion is None)
                  or (status == 'completed' and conclusion in ('success', 'failure', 'cancelled'))), 'native run state is not eligible'
          assert run.get('event') in ('push', 'workflow_dispatch'), 'untrusted native run event'
          assert run.get('path') == '.github/workflows/build.yml', 'unexpected workflow path'
          assert run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY'], 'run repository mismatch'
          jobs = json.load(open('verified-jobs.json', encoding='utf-8-sig')).get('jobs', [])
          for name in ('test', 'windows'):
              matches = [job for job in jobs if job.get('name') == name]
              assert (len(matches) == 1 and matches[0].get('conclusion') == 'success'
                      and matches[0].get('status') == 'completed'), f'{name} job did not pass'
          PY
      - name: Resolve stable version and refuse existing release or tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == 'create' ]]; then
            expected_branch="release/windows-${version%.*}-publish"
            [[ "$PUBLICATION_EVENT_REF" == "$expected_branch" ]]
            [[ "$GITHUB_REF" == "refs/heads/$expected_branch" ]]
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag release already exists; stable releases are immutable." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag tag already exists; refusing to move it." >&2
            exit 1
          fi
      - name: Download the validated Windows product artifact and prepare four assets
        env:
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir incoming --pattern 'WhereIsItAI-egui-windows-x64-unsigned-candidate'
          python3 tools/prepare_release_assets.py --stable
      - name: Create draft, verify downloadable bytes, then publish stable latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          tag="v$VERSION"
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "WhereIsIt AI $VERSION — Windows x64 (unsigned)" \
            --draft --latest=false --notes-file "docs/releases/$tag.md"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > draft-state.json
          python3 -c 'import json; s=json.load(open("draft-state.json")); assert s["isDraft"] is True and s["isPrerelease"] is False, "release must remain a non-prerelease draft until verified"'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published-verification
          (cd published-verification && sha256sum -c SHA256SUMS.txt)
          test "$(find published-verification -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,assets
