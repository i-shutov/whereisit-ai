# No real CTF, file names, descriptions or source digest enter this CI.
name: CTF 0x10 extension diagnostics — synthetic native acceptance
on:
  push:
    branches: [fix/ctf-opaque-type1-20261030]
    paths:
      - "crates/ctf-format/src/lib.rs"
      - "docs/qa/CTF_DESCRIPTION_GAPS.md"
      - ".github/workflows/ctf-opaque-check.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctf-opaque-check-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Exact-source strict synthetic CTF semantics and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ctf-format --locked
          cargo clippy -p ctf-format --locked --all-targets -- -D warnings
      - name: Build local-only aggregate CTF probe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p ctf-format --example description_gap_probe
          target/release/examples/description_gap_probe --self-test
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          cp target/release/examples/description_gap_probe LICENSE THIRD_PARTY_NOTICES.md dist/
          printf 'source_sha=%s\nruntime=%s/%s\nreal_data_in_ci=false\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > dist/PROVENANCE.txt
          (cd dist && sha256sum description_gap_probe LICENSE THIRD_PARTY_NOTICES.md PROVENANCE.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ctf-opaque-aggregate-probe-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 21
