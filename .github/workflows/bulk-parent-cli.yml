# Produces only the native CLI; the private catalog remains on the test machine.
name: Bulk parent cache Linux CLI for private A/B
on:
  push:
    branches: [perf/bulk-parent-scope-20261029]
    paths:
      - "crates/atlas-core/src/lib.rs"
      - "crates/atlas-core/tests/bulk_parent_cache.rs"
      - ".github/workflows/bulk-parent-cli.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parent-cache-cli-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check source fidelity and parent-scope contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p atlas-core --test bulk_parent_cache
          cargo clippy --locked -p atlas-core --all-targets -- -D warnings
      - name: Build exact-source Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p atlas-cli
          test "$(target/release/atlas --sqlite-version)" = 3.51.3
          mkdir dist
          cp target/release/atlas LICENSE THIRD_PARTY_NOTICES.md dist/
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'commit=%s\narchitecture=%s\nsqlite=%s\nprivate_catalog_in_ci=false\n' \
            "$GITHUB_SHA" "$(uname -m)" "$(./dist/atlas --sqlite-version)" > dist/PROVENANCE.txt
          (cd dist && sha256sum atlas LICENSE THIRD_PARTY_NOTICES.md PROVENANCE.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bulk-parent-cli-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 21
