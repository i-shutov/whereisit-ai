name: PR58 prototype workspace regressions
on:
  pull_request:
    paths:
      - 'apps/ui-prototype/**'
      - '.github/workflows/prototype-workspaces.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ui-prototype/**'
      - '.github/workflows/prototype-workspaces.yml'
permissions:
  contents: read
concurrency:
  group: prototype-workspaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ui-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the frozen demo dependency set
        run: npm exec --yes --package=bun@1.4.5 -- bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run test:workspaces
      - run: npm run build
